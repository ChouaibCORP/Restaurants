name: CI/CD -- Restaurant API

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - develop

env:
  IMAGE_NAME: chouaibk/restaurant-api
  SOLUTION_FILE: Restaurants.Administration.sln

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurer les dependances
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Compiler le projet
        run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore --configuration Release

      - name: Executer les tests
        run: dotnet test ${{ env.SOLUTION_FILE }} --no-build --configuration Release --verbosity normal

  docker-publish:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    needs: build-and-test
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generer les tags et metadonnees
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Builder et pousser l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Presentation/Restaurants.Presentation.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker-publish
    permissions:
      contents: write
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Recuperer le tag de l'image
        id: image
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "tag=sha-$TAG" >> $GITHUB_OUTPUT
          echo "Image a deployer : chouaibk/restaurant-api:sha-$TAG"

      - name: Mettre a jour compose.yaml avec le nouveau tag
        run: |
          sed -i "s|image: .*restaurant-api.*|image: chouaibk/restaurant-api:${{ steps.image.outputs.tag }}|" compose.yaml
          echo "=== compose.yaml apres mise a jour ==="
          grep "image:" compose.yaml

      - name: Committer la mise a jour du compose.yaml
        run: |
          ENV_NAME="${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add compose.yaml
          git commit -m "deploy($ENV_NAME): image chouaibk/restaurant-api:${{ steps.image.outputs.tag }} [skip ci]" || echo "Rien a committer"
          git push || echo "Push ignore"

      - name: Resume du deploiement
        run: |
          ENV_NAME="${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}"
          echo "## Deploiement $ENV_NAME reussi" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image deployee** : \`chouaibk/restaurant-api:${{ steps.image.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY